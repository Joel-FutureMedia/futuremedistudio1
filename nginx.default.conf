server {
    listen 5173;
    listen [::]:5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    open_file_cache max=2000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # SPA shell — always revalidate so deploys propagate quickly
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite content-hashed bundles
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Video — long cache, byte-range streaming, fast MP4 start (moov atom must be at file start)
    location ~* ^/media/.+\.mp4$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        access_log off;

        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 10m;

        try_files $uri =404;
    }

    location ~* ^/media/.+\.webm$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        access_log off;
        try_files $uri =404;
    }

    # Public images (public/media/)
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # Long-cache static media (videos, posters, images)
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
